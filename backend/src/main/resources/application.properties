spring.application.name=Mapaka

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

mapaka.jwt.secret=${JWT_SECRET}
mapaka.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:15m}
mapaka.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:30d}
mapaka.cors.allowed-origin=${FRONTEND_URL}
