spring.datasource.url=jdbc:postgresql://localhost:5432/mapaka
spring.datasource.username=mapaka
spring.datasource.password=mapaka

spring.jpa.show-sql=true

# Nomes per a desenvolupament local — en producció JWT_SECRET i FRONTEND_URL
# s'han de proporcionar sempre com a variables d'entorn (mai hardcodejades).
mapaka.jwt.secret=${JWT_SECRET:mapaka-dev-secret-canvia-en-produccio-0123456789abcdef}
mapaka.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
