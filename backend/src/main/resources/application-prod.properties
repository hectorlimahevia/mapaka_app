# spring.datasource.* prové exclusivament de DatabaseUrlEnvironmentPostProcessor
# (parteix DATABASE_URL — Neon/Render el donen com postgres://usuari:contrasenya@host/bd,
# que el driver JDBC no accepta tal qual). No hi ha cap línia spring.datasource.url aquí
# a propòsit: competiria en precedència amb el post-processor i guanyaria el valor cru.

spring.jpa.show-sql=false

# Render fa de proxy TLS davant del contenidor (l'app rep HTTP intern) — sense això,
# ServletUriComponentsBuilder (enllaços d'etiquetes NFC) generaria http://<host intern>
# en lloc de https://mapaka-backend.onrender.com a partir dels headers X-Forwarded-*.
server.forward-headers-strategy=framework

# Pool de connexions a Neon (pla gratuït, 100 CU-hores/mes). Amb els valors per defecte de
# Hikari l'app mantenia 10 connexions obertes sense parar i el còmput de Neon no arribava a
# suspendre's mai (0,25 CU sempre actiu = ~6 CU-hores/dia). Sense connexions ocioses pot
# escalar a zero als 5 minuts; la primera petició després d'una estona sense ús triga un
# parell de segons més mentre Neon es desperta.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=120000
