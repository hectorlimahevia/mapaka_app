services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mapaka
      POSTGRES_USER: mapaka
      POSTGRES_PASSWORD: mapaka
    ports:
      - "5432:5432"
    volumes:
      - mapaka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapaka -d mapaka"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mapaka
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mapaka_postgres_data:
